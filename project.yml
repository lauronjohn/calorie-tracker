name: CalorieTracker

options:
  bundleIdPrefix: com.lauronjohn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  CalorieTracker:
    type: application
    platform: iOS
    sources:
      - path: Sources/CalorieTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lauronjohn.calorietracker
        PRODUCT_NAME: CalorieTracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Calories
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          Used to photograph your meals so they can be analysed for calories and macros.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: >-
          Used to pick an existing meal photo to analyse for calories and macros.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: >-
          Used to record you describing a meal so it can be transcribed instead of typed.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: >-
          Used to turn what you say about a meal into text for analysis.

  CalorieTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CalorieTrackerTests
    dependencies:
      - target: CalorieTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lauronjohn.calorietracker.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CalorieTracker:
    build:
      targets:
        CalorieTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CalorieTrackerTests
